name: Build Plugin

on:
  workflow_dispatch:  # 仅手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 只获取最新提交，加快克隆速度

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      # 缓存NuGet包，大幅提升构建速度
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore StrmAssistant/StrmAssistant.csproj

      - name: Build the project
        run: dotnet build StrmAssistant/StrmAssistant.csproj --no-restore --configuration Release -p:UseSharedCompilation=false -p:StrmAssistantPluginOutputDir=

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "StrmAssistant/StrmAssistant.csproj"
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          if (-not $version) { throw "Version not found in csproj" }
          "value=$version" >> $env:GITHUB_OUTPUT

      # 收集编译产物（ILRepack 打包后的版本化 DLL）
      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $dll = Get-ChildItem "StrmAssistant/bin/Release/net6.0/StrmAssistantPlus_v*.dll" | Select-Object -First 1
          if (-not $dll) { throw "Versioned DLL not found" }
          Copy-Item $dll.FullName -Destination artifact/
          Get-ChildItem artifact/ | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrmAssistantPlus_v${{ steps.version.outputs.value }}
          path: artifact/*
          compression-level: 0  # DLL已经是二进制，不需要压缩
          retention-days: 30

      # 发布到 Release（资产无需认证即可下载，便于 DSM 部署）
      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StrmAssistantPlus v${{ steps.version.outputs.value }} build #${{ github.run_number }}
          body: |
            Auto-build from commit ${{ github.sha }}
            Version: ${{ steps.version.outputs.value }}
            Emby 4.9 / 4.10 compatible
          files: artifact/*.dll
          fail_on_unmatched_files: true
